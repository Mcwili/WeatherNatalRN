name: Android Build

on:
  push:
    branches: [claude/apk-entwicklung-plan-it131r]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempoRN-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to apk-dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/dist
          cp app/build/outputs/apk/release/app-universal-release.apk "/tmp/dist/TempoRN-v1.0.0.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "/tmp/dist/TempoRN-v1.0.0-arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "/tmp/dist/TempoRN-v1.0.0-arm32.apk"
          cd /tmp/dist
          git init -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Tempo RN APK build ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-dist
